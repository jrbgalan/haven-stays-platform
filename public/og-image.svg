<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="60%" stop-color="#1C1B18"/>
      <stop offset="100%" stop-color="#26231E"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6C9"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#9E7B3B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A96E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="radialGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#141312" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#radialGlow)"/>

  <!-- Hairline Gold Border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#C9A96E" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Top Decorative Header Line -->
  <line x1="200" y1="30" x2="1000" y2="30" stroke="url(#glow)" stroke-width="2"/>

  <!-- Brand Eyebrow -->
  <text x="600" y="180" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#C9A96E" text-anchor="middle">
    A M A N  ·  A I R B N B  L U X E  ·  A P P L E  S T A N D A R D
  </text>

  <!-- Center Monogram Emblem -->
  <g transform="translate(568, 210) scale(1)">
    <rect width="64" height="64" rx="16" fill="#24211D" stroke="#C9A96E" stroke-opacity="0.4" stroke-width="1"/>
    <text x="32" y="44" font-family="'Fraunces', 'Georgia', serif" font-size="34" font-weight="600" fill="url(#goldText)" text-anchor="middle">H</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="340" font-family="'Fraunces', 'Georgia', serif" font-size="64" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
    Haven
  </text>
  <text x="600" y="405" font-family="'Fraunces', 'Georgia', serif" font-size="36" font-style="italic" font-weight="300" fill="url(#goldText)" text-anchor="middle">
    Curated Luxury Sanctuaries & Bespoke Escapes
  </text>

  <!-- Features Strip -->
  <text x="600" y="480" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#A8A29E" text-anchor="middle" letter-spacing="1">
    Multi-Product Agoda Search  ·  AI Trip Concierge  ·  140+ Haven Verified Standards  ·  Private Host Network
  </text>

  <!-- Bottom Crest & Copyright -->
  <line x1="450" y1="520" x2="750" y2="520" stroke="url(#glow)" stroke-width="1"/>
  <text x="600" y="555" font-family="'Inter', sans-serif" font-size="13" font-weight="500" letter-spacing="2" fill="#78716C" text-anchor="middle">
    HAVEN.LUXURY  ·  PORTFOLIO FLAGSHIP
  </text>
</svg>

